[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-kt-harness"
version = "0.1.0"
description = "Modular EGP grammar-to-KT experimental harness"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "numpy==2.5.1",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
include = ["modules*", "shared*"]
