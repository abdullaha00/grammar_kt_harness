generation:
  cell_001_1:
    response: {prompt: "Every morning, Lina ___ to work by bus. (travel)", target_answer: "Every morning, Lina travels to work by bus.", accepted_answers: ["Every morning, Lina travels to work by bus."], operation_tags: [], note: "Common A2 routine context."}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "Lina describes her routine: ‘Every morning, I ___ to work by bus.’ (travel)", target_answer: "Every morning, I travel to work by bus.", accepted_answers: ["Every morning, I travel to work by bus."], operation_tags: [], note: "First-person utterance gives an explicit speaker context."}
  cell_002_1:
    response: {prompt: "Yesterday, Omar ___ the door because it was stuck. (not / open)", target_answer: "Yesterday, Omar did not open the door because it was stuck.", accepted_answers: ["Yesterday, Omar did not open the door because it was stuck."], operation_tags: [do_support, negation], note: "Past time cue and negative cue determine the response."}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "A friend asks about yesterday. Reply: ‘Omar ___ the door because it was stuck.’ (not / open)", target_answer: "Omar did not open the door because it was stuck.", accepted_answers: ["Omar did not open the door because it was stuck."], operation_tags: [do_support, negation], note: "Reply frame supplies discourse context."}
  cell_003_1:
    response: {prompt: "Yesterday, the meal ___ by Ana. (prepare)", target_answer: "Yesterday, the meal was prepared by Ana.", accepted_answers: ["Yesterday, the meal was prepared by Ana."], operation_tags: [be_passive], note: "Agent phrase makes passive voice determinate."}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "Who cooked? Complete the reply: ‘The meal ___ by Ana yesterday.’ (prepare)", target_answer: "The meal was prepared by Ana yesterday.", accepted_answers: ["The meal was prepared by Ana yesterday."], operation_tags: [be_passive], note: "Question-reply context licenses the agent phrase."}
  cell_004_1:
    response: {prompt: "Right now, Mia ___ a book. (read)", target_answer: "Right now, Mia is reading a book.", accepted_answers: ["Right now, Mia is reading a book."], operation_tags: [progressive], note: "Right-now cue determines progressive aspect."}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "‘What is Mia doing?’ ‘Right now, she ___ a book.’ (read)", target_answer: "Right now, she is reading a book.", accepted_answers: ["Right now, she is reading a book."], operation_tags: [progressive], note: "Dialogue explicitly asks about an ongoing action."}
  cell_005_1:
    response: {prompt: "Right now, the rooms ___ by the team. (not / clean)", target_answer: "Right now, the rooms are not being cleaned by the team.", accepted_answers: ["Right now, the rooms are not being cleaned by the team."], operation_tags: [progressive, be_passive, negation], note: "Agent and time cues control the auxiliary chain."}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "A manager checks the schedule: ‘At the moment, the rooms ___ by the team.’ (not / clean)", target_answer: "At the moment, the rooms are not being cleaned by the team.", accepted_answers: ["At the moment, the rooms are not being cleaned by the team."], operation_tags: [progressive, be_passive, negation], note: "Workplace utterance supplies a plausible context."}
  cell_006_1:
    response: {prompt: "___ we take the earlier train? (should)", target_answer: "Should we take the earlier train?", accepted_answers: ["Should we take the earlier train?"], operation_tags: [central_modal, operator_inversion], note: "Modal cue and question mark determine form."}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "The last train may be busy. Ask your friend: ‘___ we take the earlier train?’ (should)", target_answer: "Should we take the earlier train?", accepted_answers: ["Should we take the earlier train?"], operation_tags: [central_modal, operator_inversion], note: "Travel problem makes advice-seeking pragmatic."}

