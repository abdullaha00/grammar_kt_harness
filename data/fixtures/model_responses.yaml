generation:
  cell_001_1:
    response: {prompt: "Every morning, Lina ___ to work by bus. (travel)", target_answer: "Every morning, Lina travels to work by bus.", accepted_answers: ["travels"]}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "Lina describes her routine: ‘Every morning, I ___ to work by bus.’ (travel)", target_answer: "Every morning, I travel to work by bus.", accepted_answers: ["travel"]}
  cell_002_1:
    response: {prompt: "Yesterday, Omar ___ the door because it was stuck. (not / open)", target_answer: "Yesterday, Omar did not open the door because it was stuck.", accepted_answers: ["did not open"]}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "A friend asks about yesterday. Reply: ‘Omar ___ the door because it was stuck.’ (not / open)", target_answer: "Omar did not open the door because it was stuck.", accepted_answers: ["did not open"]}
  cell_003_1:
    response: {prompt: "Yesterday, the meal ___ by Ana. (prepare)", target_answer: "Yesterday, the meal was prepared by Ana.", accepted_answers: ["was prepared"]}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "Who cooked? Complete the reply: ‘The meal ___ by Ana yesterday.’ (prepare)", target_answer: "The meal was prepared by Ana yesterday.", accepted_answers: ["was prepared"]}
  cell_004_1:
    response: {prompt: "Right now, Mia ___ a book. (read)", target_answer: "Right now, Mia is reading a book.", accepted_answers: ["is reading"]}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "‘What is Mia doing?’ ‘Right now, she ___ a book.’ (read)", target_answer: "Right now, she is reading a book.", accepted_answers: ["is reading"]}
  cell_005_1:
    response: {prompt: "Right now, the rooms ___ by the team. (not / clean)", target_answer: "Right now, the rooms are not being cleaned by the team.", accepted_answers: ["are not being cleaned"]}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "A manager checks the schedule: ‘At the moment, the rooms ___ by the team.’ (not / clean)", target_answer: "At the moment, the rooms are not being cleaned by the team.", accepted_answers: ["are not being cleaned"]}
  cell_006_1:
    response: {prompt: "___ we take the earlier train? (should)", target_answer: "Should we take the earlier train?", accepted_answers: ["Should"]}
    variants:
      - prompt_contains: "CONTEXTUALISED CONDITION"
        response: {prompt: "The last train may be busy. Ask your friend: ‘___ we take the earlier train?’ (should)", target_answer: "Should we take the earlier train?", accepted_answers: ["Should"]}

