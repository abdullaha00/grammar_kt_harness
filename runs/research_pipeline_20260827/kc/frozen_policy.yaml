policy_id: factorized
description: Marked English grammar features are separate KCs; background values are
  not asserted as KCs.
kcs:
- id: kc_present
  definition: Select present finite morphology.
  activation:
    cell:
      tense: present
- id: kc_past
  definition: Select past finite morphology.
  activation:
    cell:
      tense: past
- id: kc_progressive
  definition: Construct progressive BE plus an -ing complement.
  activation:
    cell:
      aspect: progressive
- id: kc_passive
  definition: Construct canonical BE-passive voice.
  activation:
    cell:
      voice: passive
- id: kc_negation
  definition: Realise grammatical negation and any required operator.
  activation:
    cell:
      polarity: negative
- id: kc_polar_question
  definition: Form a polar question with operator-subject order.
  activation:
    cell:
      clause: polar_question
- id: kc_modal_should
  definition: Use central modal SHOULD with a base-form complement.
  activation:
    cell:
      modal: should
selection_metadata:
  mode: predefined
  policy_declared_before_projection: true
  items_or_outcomes_used: false
