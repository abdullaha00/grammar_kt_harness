world_id: phase4_mixed_v1
claim: >-
  Responses combine reusable feature knowledge, selected interaction-specific
  knowledge, and a weaker exact-cell component. This deliberately violates any
  single granularity assumption.
seed: 20260827
learners: 240
passes: 6
item_order: counterbalanced_rotate_by_learner_and_pass

latent_structure:
  components:
    - kind: feature_values
      background_values:
        tense: [NA]
        aspect: [none]
        voice: [active]
        polarity: [positive]
        clause: [declarative]
        modal: [none]
      initial_mastery_beta: [3.0, 3.0]
      learning_rate: 0.07
      weight: 1.0
    - kind: declared_interactions
      initial_mastery_beta: [1.2, 6.8]
      learning_rate: 0.025
      weight: 1.5
      interactions:
        - id: perfect_negative
          activation: {aspect: perfect, polarity: negative}
        - id: present_negative
          activation: {tense: present, polarity: negative}
        - id: present_passive
          activation: {tense: present, voice: passive}
    - kind: exact_cells
      scope: all_cells
      initial_mastery_beta: [2.0, 4.0]
      learning_rate: 0.035
      weight: 0.75

background_mastery_beta: [4.0, 2.0]
background_learning_rate: 0.08
difficulty:
  base: 0.0
  per_active_dimension: 0.0
  adjustments:
    - {activation: {voice: passive}, amount: 0.30}
    - {activation: {aspect: [perfect_progressive]}, amount: 0.20}
    - {activation: {clause: [polar_question, imperative]}, amount: 0.15}
    - {activation: {modal: {not: none}}, amount: 0.25}
response:
  discrimination: 3.0
  guess_floor: 0.08
  slip_ceiling: 0.08
temporal_split:
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
