world_id: phase3_factorized_v1
claim: >-
  Controlled factorized learner world over the nine explicit feature-value
  conditions observed in the Phase-3 development bank. Hidden dimensions are
  experimental data-generating assumptions, not claims about human KCs.
seed: 20260827
learners: 300
passes: 8
item_order: counterbalanced_rotate_by_learner_and_pass

hidden_dimensions:
  - id: hidden_tense_present
    activation: {tense: present}
    initial_mastery_beta: [3.0, 3.0]
    learning_rate: 0.07
  - id: hidden_tense_past
    activation: {tense: past}
    initial_mastery_beta: [2.5, 3.5]
    learning_rate: 0.07
  - id: hidden_aspect_perfect
    activation: {aspect: perfect}
    initial_mastery_beta: [2.4, 3.6]
    learning_rate: 0.06
  - id: hidden_aspect_perfect_progressive
    activation: {aspect: perfect_progressive}
    initial_mastery_beta: [2.0, 4.0]
    learning_rate: 0.05
  - id: hidden_aspect_progressive
    activation: {aspect: progressive}
    initial_mastery_beta: [2.5, 3.5]
    learning_rate: 0.07
  - id: hidden_voice_passive
    activation: {voice: passive}
    initial_mastery_beta: [2.0, 4.0]
    learning_rate: 0.05
  - id: hidden_polarity_negative
    activation: {polarity: negative}
    initial_mastery_beta: [2.4, 3.6]
    learning_rate: 0.06
  - id: hidden_clause_polar_question
    activation: {clause: polar_question}
    initial_mastery_beta: [2.1, 3.9]
    learning_rate: 0.05
  - id: hidden_clause_imperative
    activation: {clause: imperative}
    initial_mastery_beta: [3.0, 3.0]
    learning_rate: 0.08

background_mastery_beta: [4.0, 2.0]
difficulty:
  base: 0.0
  per_active_dimension: 0.0
  adjustments: []
response:
  discrimination: 3.0
  guess_floor: 0.08
  slip_ceiling: 0.08
learning_update: mastery_moves_toward_one_after_each_opportunity
temporal_split:
  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20
