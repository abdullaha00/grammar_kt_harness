policy_id: factorized_interactions
description: The factorized baseline plus two explicit auxiliary-chain/operation interactions.
kcs:
  - {id: kc_present, definition: Select present finite morphology., activation: {cell: {tense: present}}}
  - {id: kc_past, definition: Select past finite morphology., activation: {cell: {tense: past}}}
  - {id: kc_progressive, definition: Construct progressive BE plus an -ing complement., activation: {cell: {aspect: progressive}}}
  - {id: kc_passive, definition: Construct canonical BE-passive voice., activation: {cell: {voice: passive}}}
  - {id: kc_negation, definition: Realise grammatical negation and any required operator., activation: {cell: {polarity: negative}}}
  - {id: kc_polar_question, definition: Form a polar question with operator-subject order., activation: {cell: {clause: polar_question}}}
  - {id: kc_modal_should, definition: Use central modal SHOULD with a base-form complement., activation: {cell: {modal: should}}}
  - id: kc_progressive_passive
    definition: Coordinate progressive and passive BE in one auxiliary chain.
    activation:
      all:
        - {cell: {aspect: progressive}}
        - {cell: {voice: passive}}
  - id: kc_past_negative
    definition: Coordinate past DO-support with negation for a lexical target.
    activation:
      all:
        - {cell: {tense: past}}
        - {cell: {polarity: negative}}
