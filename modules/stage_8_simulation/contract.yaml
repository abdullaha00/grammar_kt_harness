module: simulation
input:
  - {path: items/validation/accepted_items.jsonl, type: "ItemSpec[]"}
  - {path: qmatrix/q_matrix.csv, type: BinaryQMatrix}
configuration:
  - simulation.config
  - simulation.seed
  - simulation.learners
  - simulation.events_per_learner
procedure: Execute the declared synthetic process and keep observable and oracle records separate.
output:
  - {path: observable_interactions.jsonl, type: "Interaction[]"}
  - {path: oracle_interactions.jsonl, type: "OracleInteraction[]"}
forbidden_state: [source, normalization, canonical, realization, kt]
