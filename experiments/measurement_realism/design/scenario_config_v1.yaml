curated_bank_contract:
  schema_path: modules/measurement_realism/matched_bank/schemas/curated_item.schema.json
  items_path_pattern: experiments/measurement_realism/design/bank_protocol/runs/{run_id}/bank/items.jsonl
  schema_hash_frozen_with_run_plan: true
