# addressed below; the harness refuses to load it if that file changes.
design_id: measurement_realism_minimal_confirmatory_v1
status: FROZEN_BEFORE_RESPONSE_GENERATION
date_frozen: 2026-08-30
protected_reference: data/grammar_kt_full_v1

base_config:
  path: experiments/measurement_realism/design/scenario_config_proposal.yaml
  sha256: 8676afae327f78f803fab9fc29fac954c7e78af864157f9287a628f601ed5102

selected_cells:
  path: experiments/measurement_realism/design/format_selection/selected_cells.json
  sha256: 8f8fa56e710982c92426f154482d062cffebfb32d29f19c7fe96f4208a4b479b
  seen_acquisition_cells: 18
  held_out_probe_cells: 2
