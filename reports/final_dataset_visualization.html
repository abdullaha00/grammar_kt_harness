<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grammar-KT full-v1 dataset</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: clamp(1.25rem, 5vw, 3.5rem);
      background: Canvas;
      color: CanvasText;
      font-size: 1rem;
      line-height: 1.5;
    }

    main {
      width: min(100%, 58rem);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    p,
    figure {
      margin: 0;
    }

    .eyebrow {
      margin-bottom: 0.3rem;
      color: GrayText;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 0.25rem;
      color: GrayText;
    }

    figure {
      margin-top: clamp(1.5rem, 4vw, 2.5rem);
    }

    .event-head,
    .response,
    .scale {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.25rem;
      flex-wrap: wrap;
    }

    .learner {
      font-weight: 500;
    }

    .event-meta,
    .response-note,
    figcaption {
      color: GrayText;
    }

    .prompt {
      margin: 0.8rem 0;
      padding: 1rem 1.1rem;
      border-left: 4px solid AccentColor;
      background: color-mix(in srgb, CanvasText 5%, Canvas);
    }

    .prompt-text {
      margin-top: 0.3rem;
      font-size: 1.08rem;
    }

    .response {
      padding: 0.65rem 0;
      border-bottom: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
    }

    .outcome {
      font-weight: 500;
    }

    .mapping {
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) 1rem minmax(0, 1.45fr) 1rem minmax(0, 1.15fr);
      gap: 0.75rem;
      align-items: center;
      padding: 1rem 0 0.65rem;
    }

    .node strong {
      display: block;
      margin-top: 0.18rem;
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .arrow {
      color: GrayText;
      text-align: center;
    }

    .arrow::before {
      content: "→";
    }

    .answer-key {
      margin-top: 0.45rem;
      color: GrayText;
    }

    .answer-key .eyebrow {
      display: block;
      margin-bottom: 0.1rem;
    }

    figcaption {
      margin-top: 1.25rem;
      padding-top: 0.8rem;
      border-top: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
    }

    .scale {
      color: CanvasText;
    }

    .scale strong {
      font-weight: 500;
    }

    .inventory {
      margin-top: 0.35rem;
    }

    @media (max-width: 52rem) {
      .mapping {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }

      .arrow {
        width: max-content;
      }

      .arrow::before {
        content: "↓";
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Frozen public dataset</p>
      <h1>Grammar-KT full-v1</h1>
      <p class="subtitle">One learner event, end to end</p>
    </header>

    <figure aria-label="A real observable event and its fixed grammatical and generator-KC mapping">
      <div class="event-head">
        <div>
          <span class="eyebrow">Learner</span>
          <div class="learner">learner_000001</div>
        </div>
        <div class="event-meta">Acquisition · seen grammar · event 2 of 283</div>
      </div>

      <section class="prompt" aria-labelledby="prompt-label">
        <div class="eyebrow" id="prompt-label">Prompt shown to learner</div>
        <p class="prompt-text">Mia had a map, so she found the house. Without the map, [____]. (find)</p>
      </section>

      <div class="response">
        <div>
          <span class="eyebrow">Observable response</span>
          <div class="outcome">Correct = 1</div>
        </div>
        <div class="response-note">Binary outcome only; no free-text learner answer is stored</div>
      </div>

      <div class="mapping" aria-label="Item to GrammarCell to true generator-KC mapping">
        <div class="node">
          <span class="eyebrow">Item</span>
          <strong>candidate_gc_e7fef77abc10b5ba_01</strong>
        </div>
        <span class="arrow" aria-hidden="true"></span>
        <div class="node">
          <span class="eyebrow">GrammarCell</span>
          <strong>tense: NA · aspect: perfect · voice: active · polarity: negative · clause: declarative · modal: would</strong>
        </div>
        <span class="arrow" aria-hidden="true"></span>
        <div class="node">
          <span class="eyebrow">Q* requires · generator KCs</span>
          <strong>perfect construction · central modal WOULD · verbal negation</strong>
        </div>
      </div>

      <p class="answer-key">
        <span class="eyebrow">Answer key · not shown during the attempt</span>
        she would not have found the house
      </p>

      <figcaption>
        <div class="scale">
          <span><strong>1,000 learners</strong> × 283 events each</span>
          <span><strong>283,000 observable rows</strong></span>
        </div>
        <p class="inventory">170 acquisition + 113 probe events per learner · 113 items · 75 GrammarCells · 18 generator KCs</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>
